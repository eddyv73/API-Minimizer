version: '3.8'

services:
  # Servicio de build para el frontend
  api-minimizer-front-build:
    build:
      context: .
      dockerfile: ApiFront/Dockerfile
      args:
        BUILD_TYPE: Release
        DOTNET_ENVIRONMENT: Production
      cache_from:
        - ghcr.io/${GITHUB_REPOSITORY:-api-minimizer}/api-minimizer-front:latest
      cache_to: type=inline
    image: ${DOCKER_REGISTRY:-}apiminimizer:${VERSION:-latest}
    profiles:
      - build

  # Servicio de build para el backend
  api-minimizer-back-build:
    build:
      context: .
      dockerfile: ApiBack/API-Minimizer-back/Dockerfile
      args:
        BUILD_TYPE: Release
        DOTNET_ENVIRONMENT: Production
      cache_from:
        - ghcr.io/${GITHUB_REPOSITORY:-api-minimizer}/api-minimizer-back:latest
      cache_to: type=inline
    image: ${DOCKER_REGISTRY:-}apiminimizerback:${VERSION:-latest}
    profiles:
      - build

  # Servicio de test para el frontend
  api-minimizer-front-test:
    image: ${DOCKER_REGISTRY:-}apiminimizer:${VERSION:-latest}
    profiles:
      - test
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Servicio de test para el backend
  api-minimizer-back-test:
    image: ${DOCKER_REGISTRY:-}apiminimizerback:${VERSION:-latest}
    profiles:
      - test
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Servicio de staging
  api-minimizer-staging:
    image: ${DOCKER_REGISTRY:-}apiminimizer:${VERSION:-latest}
    profiles:
      - staging
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "8082:80"
    depends_on:
      api-minimizer-back-staging:
        condition: service_healthy

  api-minimizer-back-staging:
    image: ${DOCKER_REGISTRY:-}apiminimizerback:${VERSION:-latest}
    profiles:
      - staging
    environment:
      - ASPNETCORE_ENVIRONMENT=Staging
      - ASPNETCORE_URLS=http://+:80
    ports:
      - "8083:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: api-minimizer-network
    driver: bridge 